name: Perf Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "next.config.ts"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lighthouse CI
        run: npx --package=@lhci/cli lhci autorun --config=./lighthouserc.json
